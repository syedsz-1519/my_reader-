<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TTS Reader</title>
    <meta
      name="description"
      content="Calm, privacy-first text-to-speech reader with synchronized sentence and word highlighting, offline neural voices, and document importers. Everything runs in your browser."
    />
    <meta name="theme-color" content="#2F6F5E" />

    <!-- OpenGraph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TTS Reader" />
    <meta
      property="og:description"
      content="Web Speech & offline neural text-to-speech reader with synchronized word highlighting, speed and pitch controls, and multi-language device voice support."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TTS Reader" />
    <meta
      name="twitter:description"
      content="Calm, privacy-first text-to-speech reader. Everything runs in your browser. No text leaves your device."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Structured Data (Schema.org WebApplication) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TTS Reader",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Web",
        "description": "Privacy-first text-to-speech reader with synchronized sentence and word highlighting, offline neural voices, and multi-language device voice support."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
